<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="track">
        <img src="car1.svg" alt="" class="car1">
        <img src="finish.png" alt="" class="finish">
    </div>
    <div class="track">
        <img src="car2.svg" alt="" class="car2">
        <img src="finish.png" alt="" class="finish">
    </div>
    <p>Твой счет: <span class="score">100</span></p>
    <p>Твоя ставка: <span class="bet">10</span></p>
    <div class="buttons">
        <button class="button-minus">-10</button>
        <button class="button-plus">+10</button>
    </div>
    <p>Кто победит?</p>
    <div class="buttons-car">
        <button class="black-btn">Черная</button>
        <button class="white-btn">Белая</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
